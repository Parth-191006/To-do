name: Android APK

# Builds an installable release APK two ways:
#   1. Manually — Actions tab → "Android APK" → Run workflow
#   2. Automatically — push a tag like v1.0.1; the APK is also attached to a
#      GitHub Release, which is the easiest thing to download on a phone.
#
# Signing
# -------
# Android refuses to update an installed app across a signature change (and the
# only way round it is to uninstall, which wipes local data). So the CI keystore
# is generated ONCE and then kept in the Actions cache, keyed by
# `taskflow-release-keystore-v1`. Every later build — manual or tagged — reuses
# it, so builds update each other cleanly.
#
# To pin the signing key yourself instead, add these repository secrets and the
# workflow will prefer them:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# See docs/INSTALL.md.
#
# If the cache is ever evicted (~7 days without a run) a fresh key is minted and
# you will need to uninstall once more; bump the key suffix to force that
# deliberately.
#
# Build-time notes:
#   - The first run is a cold Gradle build (~20–40 min on public runners).
#     gradle/actions/setup-gradle caches the wrapper, dependencies and build
#     cache, so subsequent runs are much faster.
#   - The JVM heap is raised in android/gradle.properties after prebuild; the
#     ~2 GB default GC-thrashes on React Native release builds.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Caches ~/.gradle (wrapper distribution, dependency jars, build cache).
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Android SDK + cmdline-tools ship preinstalled on ubuntu-latest.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Tune Gradle for the runner
        run: |
          # CI runner tuning: 4 vCPUs / 16 GB RAM. Gradle.properties is
          # key=value where the LAST occurrence wins, so appending overrides
          # whatever expo prebuild generated.
          {
            printf '\n# CI runner tuning (appended by android-apk.yml)\n'
            printf 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\n'
            printf 'org.gradle.parallel=true\n'
            printf 'org.gradle.caching=true\n'
            printf 'android.enableJetifier=false\n'
          } >> android/gradle.properties
          tail -8 android/gradle.properties

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 1. Prefer a keystore supplied through secrets (stable, user-owned).
      - name: Restore keystore from secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > taskflow-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # 2. Otherwise reuse the one this repo already minted.
      - name: Restore cached keystore
        id: keystore-cache
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/cache/restore@v4
        with:
          path: taskflow-release.keystore
          key: taskflow-release-keystore-v1

      # 3. Only a first-ever build needs to create one.
      - name: Create keystore
        if: ${{ secrets.KEYSTORE_BASE64 == '' && steps.keystore-cache.outputs.cache-hit != 'true' }}
        run: |
          keytool -genkeypair -v \
            -keystore taskflow-release.keystore -alias taskflow \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass taskflow-ci -keypass taskflow-ci \
            -dname "CN=TaskFlow, OU=CI, O=TaskFlow"

      - name: Save keystore for future builds
        if: ${{ secrets.KEYSTORE_BASE64 == '' && steps.keystore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: taskflow-release.keystore
          key: taskflow-release-keystore-v1

      - name: Align and sign APK
        env:
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || 'taskflow-ci' }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'taskflow' }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'taskflow-ci' }}
        run: |
          BT="$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)"

          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Unsigned APK: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks taskflow-release.keystore --ks-key-alias "$KS_ALIAS" \
            --ks-pass pass:"$KS_PASSWORD" --key-pass pass:"$KS_KEY_PASSWORD" \
            --out "TaskFlow-${{ github.ref_name }}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "TaskFlow-${{ github.ref_name }}.apk" | head -4
          ls -lh "TaskFlow-${{ github.ref_name }}.apk"

      - name: Upload artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-apk-${{ github.run_number }}
          path: TaskFlow-*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TaskFlow ${{ github.ref_name }}
          files: TaskFlow-*.apk
          generate_release_notes: true
