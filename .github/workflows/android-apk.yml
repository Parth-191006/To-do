name: Android APK

# What this does
# --------------
#   - push a tag like v1.1.0  →  build + sign one arm64-v8a APK (~50 MB, every
#                                phone made since ~2016) and attach it — plus a
#                                permanent-name copy — to a GitHub Release (the
#                                easiest thing to download on a phone)
#   - run it manually          →  Actions tab → "Android APK" → Run workflow
#   - push to main             →  only the cheap keystore job runs (seconds); it
#                                refreshes the signing identity in the cache
#
# Why the keystore has its own job
# --------------------------------
# Android refuses to update an installed app across a signature change, and the
# only way round that is to uninstall — which wipes local data. So every build
# must be signed with the SAME key.
#
# Caches are scoped per ref, and a tag-triggered run can only read caches written
# by the *default branch*. A keystore cached from a tag is therefore invisible to
# the next tag, which is how every build ended up with a different identity. The
# `keystore` job below therefore mints the key on a main run (seconds, no build)
# and every later tag restores it from the default branch.
#
# Note on the cache key: entries are stored per (key, ref), and a restore looks
# at the current ref BEFORE falling back to the default branch. So a keystore ever
# saved from a tag silently shadows the one on main. If a build reports a
# different fingerprint than the one on main, bump the `-vN` suffix below so the
# stale tag-scoped entry stops matching.
#
# To pin the key yourself instead, add these repository secrets and the workflow
# will prefer them — see docs/INSTALL.md:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#
# Other build-time notes:
#   - A cold Gradle build is ~20–40 min on public runners; gradle/actions caches
#     the wrapper, dependencies and build cache to keep later runs cheaper.
#   - The JVM heap is raised in android/gradle.properties after prebuild; the
#     ~2 GB default GC-thrashes on React Native release builds.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Seconds, not minutes. On a main run this is what establishes the stable
  # signing identity for every future build.
  keystore:
    name: Prepare signing keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore cached keystore
        uses: actions/cache/restore@v4
        with:
          path: taskflow-release.keystore
          key: taskflow-release-keystore-v2

      # GitHub does not expose the `secrets` context to step `if` blocks, so the
      # choice between secret / cached / freshly minted is made in bash.
      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > taskflow-release.keystore
            echo "Using the keystore supplied through repository secrets."
            echo "source=secret" >> "$GITHUB_OUTPUT"
          elif [ -f taskflow-release.keystore ]; then
            echo "Reusing the cached keystore — this APK can update an existing install."
            echo "source=cache" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v \
              -keystore taskflow-release.keystore -alias taskflow \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass taskflow-ci -keypass taskflow-ci \
              -dname "CN=TaskFlow, OU=CI, O=TaskFlow"
            echo "Minted a new keystore."
            if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
              echo "On the default branch, so this key is cached for every later build."
            else
              echo "::warning::A new key was minted on '${GITHUB_REF}'. Tag runs can only read default-branch caches, so this signature will not be reused — push to ${DEFAULT_BRANCH} first to pin it."
            fi
            echo "source=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Save keystore for future builds
        if: steps.keystore.outputs.source == 'generated' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: taskflow-release.keystore
          key: taskflow-release-keystore-v2

      # Printed on the run's Summary page so a signature mismatch can be
      # diagnosed without digging through 30 minutes of logs.
      - name: Show signing certificate fingerprint
        env:
          SOURCE: ${{ steps.keystore.outputs.source }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || 'taskflow-ci' }}
        run: |
          set -uo pipefail
          FINGERPRINT=$(keytool -list -v -keystore taskflow-release.keystore \
            -storepass "$KS_PASSWORD" -alias taskflow 2>/dev/null \
            | grep -i 'SHA256:' | head -1 | tr -s ' ' | cut -d' ' -f2-) || true
          echo "Signing keystore source: ${SOURCE:-unknown}"
          echo "SHA-256 fingerprint: ${FINGERPRINT:-unknown}"
          {
            echo '### Signing identity'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Source | ${SOURCE:-unknown} |"
            echo "| Ref | ${GITHUB_REF} |"
            echo "| SHA-256 | ${FINGERPRINT:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore for the build job
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: taskflow-release.keystore
          retention-days: 1

  # The expensive job. Skipped on branch pushes so that keeping the signing
  # identity alive costs seconds rather than half an hour.
  build:
    name: Build release APK
    needs: keystore
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 24 matches ci.yml and the machine the suite is developed on: the
          # schema test needs the built-in `node:sqlite`, which on Node 22 is
          # still behind --experimental-sqlite.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the project (typecheck + logic suites)
        run: npm run verify

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Caches ~/.gradle (wrapper distribution, dependency jars, build cache).
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Android SDK + cmdline-tools ship preinstalled on ubuntu-latest.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Tune Gradle for the runner
        run: |
          # CI runner tuning: 4 vCPUs / 16 GB RAM. Gradle.properties is
          # key=value where the LAST occurrence wins, so appending overrides
          # whatever expo prebuild generated.
          {
            printf '\n# CI runner tuning (appended by android-apk.yml)\n'
            printf 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\n'
            printf 'org.gradle.parallel=true\n'
            printf 'org.gradle.caching=true\n'
            printf 'android.enableJetifier=false\n'
          } >> android/gradle.properties
          tail -8 android/gradle.properties

      # Ship one slim APK for modern hardware instead of a fat universal file.
      # A universal APK repeats every native library for four CPU architectures
      # (including the x86/x86_64 and 32-bit ARM variants that no current phone
      # uses), which is why the download ballooned to ~118 MB. Restricting the
      # build to arm64-v8a — the ABI of every Android device sold for years —
      # gives a single ~50 MB APK with no fallback variants to choose between.
      - name: Restrict the build to arm64-v8a
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // ABI split (appended by android-apk.yml): arm64-v8a only.
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a"
                      universalApk false
                  }
              }
          }
          EOF
          echo "--- splits config appended ---"
          tail -14 android/app/build.gradle

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Fetch the signing keystore
        uses: actions/download-artifact@v4
        with:
          name: signing-keystore

      - name: Align and sign every APK
        env:
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || 'taskflow-ci' }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'taskflow' }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'taskflow-ci' }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)"
          NAME="TaskFlow-${{ github.ref_name }}"

          echo "Unsigned outputs:"
          ls -lh android/app/build/outputs/apk/release/

          # A single arm64-v8a APK is produced; the architecture is appended
          # for clarity. It shares one versionCode and one signature with every
          # earlier release, so a newer build installs over the old one.
          for APK in android/app/build/outputs/apk/release/*release.apk; do
            [ -e "$APK" ] || continue
            BASE="$(basename "$APK")"
            case "$BASE" in
              app-arm64-v8a-*)   SUFFIX="-arm64-v8a" ;;
              *)                 SUFFIX="" ;;
            esac
            "$BT/zipalign" -f -p 4 "$APK" "aligned$SUFFIX.apk"
            "$BT/apksigner" sign \
              --ks taskflow-release.keystore --ks-key-alias "$KS_ALIAS" \
              --ks-pass pass:"$KS_PASSWORD" --key-pass pass:"$KS_KEY_PASSWORD" \
              --out "$NAME$SUFFIX.apk" "aligned$SUFFIX.apk"
            "$BT/apksigner" verify "$NAME$SUFFIX.apk"
            rm -f "aligned$SUFFIX.apk"
            echo "Signed $NAME$SUFFIX.apk"
          done

          "$BT/apksigner" verify --print-certs "$NAME-arm64-v8a.apk" | head -4
          ls -lh TaskFlow-*.apk

          # Fixed-name copy of the arm64-v8a APK: the releases/latest/download
          # permalink needs an asset name that survives version bumps, so a
          # phone can always fetch the newest build from the same URL.
          cp -f "$NAME-arm64-v8a.apk" TaskFlow-latest.apk

          # Size table on the run's Summary page.
          {
            echo '### APK sizes'
            echo ''
            echo '| APK | Size | Best for |'
            echo '| --- | --- | --- |'
            for f in TaskFlow-*.apk; do
              case "$f" in
                TaskFlow-latest.apk) AUD="same arm64-v8a build under a permanent name" ;;
                *)                   AUD="every phone made since ~2016" ;;
              esac
              SIZE="$(du -h "$f" | cut -f1)"
              echo "| \`$f\` | $SIZE | $AUD |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-apk-${{ github.run_number }}
          path: TaskFlow-*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TaskFlow ${{ github.ref_name }}
          files: TaskFlow-*.apk
          generate_release_notes: true
          # The body leads with the one download that matters, so the "keep a
          # proper apk easily downloadable" ask is met on every future release
          # without touching docs.
          body: |
            ## Download

            **→ [TaskFlow-latest.apk](https://github.com/${{ github.repository }}/releases/latest/download/TaskFlow-latest.apk) — works on every phone made since ~2016.**

            That permanent link always serves the newest release. This release
            ships a single **arm64-v8a** build (about 50 MB) — the CPU
            architecture used by essentially every Android phone sold for
            years. There is no universal or per-architecture menu to choose
            from.

            | File | Size | For |
            | --- | --- | --- |
            | `TaskFlow-latest.apk` | ~50 MB | permanent-name copy — use this link |
            | `TaskFlow-${{ github.ref_name }}-arm64-v8a.apk` | ~50 MB | same build, version-named |

            Signed with the same key as previous releases, so a newer version
            installs straight over an older one and keeps your data. Full guide:
            [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md).
