name: Android APK

# What this does
# --------------
#   - push a tag like v1.2.4  →  build + sign one arm64-v8a APK (~50 MB, every
#                                phone made since ~2016) and attach it — plus a
#                                permanent-name copy — to a GitHub Release (the
#                                easiest thing to download on a phone)
#   - run it manually          →  Actions tab → "Android APK" → Run workflow
#                                (also the quickest way to re-check the signing
#                                secrets without cutting a tag)
#
# Where the signing key comes from
# --------------------------------
# The keystore is a repository secret, never a build product:
#
#   ANDROID_KEYSTORE_BASE64     base64 of the .keystore file
#   ANDROID_KEYSTORE_PASSWORD   the store password
#   ANDROID_KEY_ALIAS           the key alias inside the keystore
#   ANDROID_KEY_PASSWORD        the key password
#
# This workflow NEVER generates a key. Android refuses to update an installed
# app across a signature change, and the only way round that is to uninstall —
# which wipes local data. A key minted per run would therefore break every
# install in turn, so a missing secret is a failed build with instructions, not
# a freshly minted identity. See docs/INSTALL.md → "Create the release keystore".
#
# Earlier revisions cached a CI-minted key (`taskflow` / `taskflow-ci`). That
# identity is retired: its password was committed in a public repository, so it
# could be used by anyone to sign an update. Releases now use only a key that
# lives in secrets.
#
# What happens after this run
# ---------------------------
# `verify-release.yml` fires on completion, downloads the APK that
# `releases/latest` serves and checks its version and signer against the tag and
# the keystore in secrets. It lives in its own workflow because none of it needs
# Gradle, and so it can also run weekly to catch drift no single release run can
# see.
#
# Other build-time notes:
#   - A cold Gradle build is ~20–40 min on public runners; gradle/actions caches
#     the wrapper, dependencies and build cache to keep later runs cheaper.
#   - The JVM heap is raised in android/gradle.properties after prebuild; the
#     ~2 GB default GC-thrashes on React Native release builds.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Runs before npm ci and the JDK setup so a signing misconfiguration costs
      # seconds, not a 20-minute Gradle build with a surprise at the end. GitHub
      # does not expose the `secrets` context to step `if` blocks, so the check
      # is made in bash.
      - name: Check the signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] || missing+=(ANDROID_KEY_PASSWORD)

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo '### Release signing is not configured'
              echo ''
              echo 'This build was stopped because these repository secrets are missing:'
              echo ''
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
              echo ''
              echo 'This workflow never generates a keystore: a key minted per build'
              echo 'cannot install over an existing app. Add the four secrets under'
              echo '**Settings → Secrets and variables → Actions**, then re-run.'
              echo ''
              echo 'Step-by-step commands: [docs/INSTALL.md → Create the release keystore](../blob/main/docs/INSTALL.md#create-the-release-keystore-once).'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Signing secrets missing::Missing repository secret(s): ${missing[*]}. See the run summary and docs/INSTALL.md. No keystore was generated."
            exit 1
          fi

          echo "All four signing secrets are set."

      - name: Restore the signing keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > taskflow-release.keystore

          # Both passwords and the alias are exercised here, so a mistyped secret
          # fails now instead of after the build.
          if ! keytool -list -keystore taskflow-release.keystore \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
                 > /dev/null 2>keytool-list.err; then
            echo "::error title=Keystore secrets are wrong::ANDROID_KEYSTORE_BASE64 decoded, but ANDROID_KEYSTORE_PASSWORD and/or ANDROID_KEY_ALIAS do not open it."
            cat keytool-list.err || true
            rm -f keytool-list.err taskflow-release.keystore
            exit 1
          fi
          rm -f keytool-list.err

          # keytool -certreq needs the *key* password, which is the only cheap way
          # to prove ANDROID_KEY_PASSWORD before apksigner runs at the very end.
          if ! keytool -certreq -keystore taskflow-release.keystore \
                 -alias "$ANDROID_KEY_ALIAS" \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 -keypass "$ANDROID_KEY_PASSWORD" \
                 -file /dev/null > /dev/null 2>keytool-key.err; then
            echo "::error title=Key password does not match::ANDROID_KEY_PASSWORD is not the password of key alias '${ANDROID_KEY_ALIAS}' in ANDROID_KEYSTORE_BASE64."
            cat keytool-key.err || true
            rm -f keytool-key.err taskflow-release.keystore
            exit 1
          fi
          rm -f keytool-key.err

          # Printed on the run's Summary page so a signature change can be
          # diagnosed without digging through 30 minutes of logs.
          FINGERPRINT=$(keytool -list -v -keystore taskflow-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | grep -i 'SHA256:' | head -1 | tr -s ' ' | cut -d' ' -f2-)
          echo "Signing keystore restored from ANDROID_KEYSTORE_BASE64."
          {
            echo '### Signing identity'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo '| Source | `ANDROID_KEYSTORE_BASE64` secret |'
            echo "| Alias | \`${ANDROID_KEY_ALIAS}\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| SHA-256 | ${FINGERPRINT:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 24 matches ci.yml and the machine the suite is developed on: the
          # schema test needs the built-in `node:sqlite`, which on Node 22 is
          # still behind --experimental-sqlite.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the project (typecheck + logic suites)
        run: npm run verify

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Caches ~/.gradle (wrapper distribution, dependency jars, build cache).
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Android SDK + cmdline-tools ship preinstalled on ubuntu-latest.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Tune Gradle for the runner
        run: |
          # CI runner tuning: 4 vCPUs / 16 GB RAM. Gradle.properties is
          # key=value where the LAST occurrence wins, so appending overrides
          # whatever expo prebuild generated.
          {
            printf '\n# CI runner tuning (appended by android-apk.yml)\n'
            printf 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\n'
            printf 'org.gradle.parallel=true\n'
            printf 'org.gradle.caching=true\n'
            printf 'android.enableJetifier=false\n'
          } >> android/gradle.properties
          tail -8 android/gradle.properties

      # Ship one slim APK for modern hardware instead of a fat universal file.
      # A universal APK repeats every native library for four CPU architectures
      # (including the x86/x86_64 and 32-bit ARM variants that no current phone
      # uses), which is why the download ballooned to ~118 MB. Restricting the
      # build to arm64-v8a — the ABI of every Android device sold for years —
      # gives a single ~50 MB APK with no fallback variants to choose between.
      - name: Restrict the build to arm64-v8a
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // ABI split (appended by android-apk.yml): arm64-v8a only.
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a"
                      universalApk false
                  }
              }
          }
          EOF
          echo "--- splits config appended ---"
          tail -14 android/app/build.gradle

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align and sign every APK
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)"
          NAME="TaskFlow-${{ github.ref_name }}"

          echo "Unsigned outputs:"
          ls -lh android/app/build/outputs/apk/release/

          # A single arm64-v8a APK is produced; the architecture is appended
          # for clarity. It shares one versionCode and one signature with every
          # earlier release, so a newer build installs over the old one.
          for APK in android/app/build/outputs/apk/release/*release.apk; do
            [ -e "$APK" ] || continue
            BASE="$(basename "$APK")"
            case "$BASE" in
              app-arm64-v8a-*)   SUFFIX="-arm64-v8a" ;;
              *)                 SUFFIX="" ;;
            esac
            "$BT/zipalign" -f -p 4 "$APK" "aligned$SUFFIX.apk"
            "$BT/apksigner" sign \
              --ks taskflow-release.keystore --ks-key-alias "$KS_ALIAS" \
              --ks-pass pass:"$KS_PASSWORD" --key-pass pass:"$KS_KEY_PASSWORD" \
              --out "$NAME$SUFFIX.apk" "aligned$SUFFIX.apk"
            "$BT/apksigner" verify "$NAME$SUFFIX.apk"
            rm -f "aligned$SUFFIX.apk"
            echo "Signed $NAME$SUFFIX.apk"
          done

          "$BT/apksigner" verify --print-certs "$NAME-arm64-v8a.apk" | head -4
          ls -lh TaskFlow-*.apk

          # Fixed-name copy of the arm64-v8a APK: the releases/latest/download
          # permalink needs an asset name that survives version bumps, so a
          # phone can always fetch the newest build from the same URL.
          cp -f "$NAME-arm64-v8a.apk" TaskFlow-latest.apk

          # Size table on the run's Summary page.
          {
            echo '### APK sizes'
            echo ''
            echo '| APK | Size | Best for |'
            echo '| --- | --- | --- |'
            for f in TaskFlow-*.apk; do
              case "$f" in
                TaskFlow-latest.apk) AUD="same arm64-v8a build under a permanent name" ;;
                *)                   AUD="every phone made since ~2016" ;;
              esac
              SIZE="$(du -h "$f" | cut -f1)"
              echo "| \`$f\` | $SIZE | $AUD |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # Never leave the decoded key lying around in the workspace. The runner
          # is discarded either way; this keeps it out of any future artifact
          # upload that forgets to exclude it.
          rm -f taskflow-release.keystore

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-apk-${{ github.run_number }}
          path: TaskFlow-*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TaskFlow ${{ github.ref_name }}
          files: TaskFlow-*.apk
          generate_release_notes: true
          # The body leads with the one download that matters, so the "keep a
          # proper apk easily downloadable" ask is met on every future release
          # without touching docs.
          body: |
            ## Download

            **→ [TaskFlow-latest.apk](https://github.com/${{ github.repository }}/releases/latest/download/TaskFlow-latest.apk) — works on every phone made since ~2016.**

            That permanent link always serves the newest release. This release
            ships a single **arm64-v8a** build (about 50 MB) — the CPU
            architecture used by essentially every Android phone sold for
            years. There is no universal or per-architecture menu to choose
            from.

            | File | Size | For |
            | --- | --- | --- |
            | `TaskFlow-latest.apk` | ~50 MB | permanent-name copy — use this link |
            | `TaskFlow-${{ github.ref_name }}-arm64-v8a.apk` | ~50 MB | same build, version-named |

            Signed with the release key held in this repository's secrets. If
            your installed build was signed with a *different* key, Android asks
            you to uninstall once — export first from **Settings → Data →
            Export** to keep your tasks. Full guide:
            [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md).
