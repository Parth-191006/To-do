name: CI

# What this does
# --------------
#   - every push and pull request → typecheck + the Vitest suites + a brand-asset
#     regression check, so a broken build is caught before it is reviewed or
#     tagged.
#   - the release APK is NOT built here. That lives in android-apk.yml and runs
#     on a `v*` tag (a cold Gradle build is 20–40 min; making every push wait on
#     a phone build would make this badge meaningless).
#
# Why Node 24
# ----------
# The schema suite opens a throwaway SQLite file through the built-in
# `node:sqlite`. On Node 22 that module is still behind --experimental-sqlite, so
# a 22 run would fail here while working everywhere else. 24 is the version the
# suite is developed and verified on.
#
# Why a separate brand job
# ------------------------
# Every launcher asset is generated by scripts/generate-logo.py, so a bad edit
# shows up as a silent asset change — a clipped adaptive layer, a monochrome
# layer that is not a silhouette, a favicon that is a solid square. None of that
# fails a TypeScript build, and scripts/verify-brand.py is what catches it.

on:
  push:
  pull_request:

permissions:
  contents: read

# A PR updated while its first run is still going should not keep both alive —
# only the newest commit matters. Scoped to this workflow, so a release build
# can never be cancelled by a branch push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + unit suites
        run: npm run verify

  brand:
    name: Brand assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Verify the generated assets
        run: python scripts/verify-brand.py
